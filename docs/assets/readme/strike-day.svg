<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="168" viewBox="0 0 560 168" role="img"><title>Forja: a hammer strikes the anvil, the chevron bounces, and the jolt tips the A of FORJA onto its side as the prompt</title><defs></defs><style>
.f-hammer{transform-box:fill-box;transform-origin:100% 40.4%;transform:rotate(38deg);animation:f-swing 5s infinite}
.f-hop{animation:f-hop 5s infinite}
.f-face{animation:f-face 5s linear infinite}
.f-spark{opacity:0;animation:f-spark 5s ease-out infinite}
.f-shake{animation:f-shake 5s linear infinite}
.f-tip{transform-box:fill-box;transform-origin:100% 100%;animation:f-tip 5s infinite}
.f-glow{animation:f-glow 5s linear infinite}
.f-land{opacity:0;animation:f-land 5s ease-out infinite}
.f-shadow{transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0);animation:f-shadow 5s infinite}
.f-cursor{opacity:0;animation:f-blink 5s steps(1) infinite}
@keyframes f-swing{0%,14%{transform:rotate(38deg);animation-timing-function:ease-in-out}18%{transform:rotate(44deg);animation-timing-function:cubic-bezier(.6,0,1,.55)}22%{transform:rotate(0deg);animation-timing-function:ease-out}26%{transform:rotate(7deg);animation-timing-function:ease-in-out}30%{transform:rotate(3deg);animation-timing-function:ease-in-out}44%,100%{transform:rotate(38deg)}}
@keyframes f-hop{0%,22%{transform:translateY(0);animation-timing-function:ease-out}27%{transform:translateY(-6px);animation-timing-function:ease-in}32%{transform:translateY(0);animation-timing-function:ease-out}35%{transform:translateY(-2px);animation-timing-function:ease-in}38%,100%{transform:translateY(0)}}
@keyframes f-face{0%,21.5%{fill:#e8571c}22%{fill:#f2a33a}28%{fill:#f2a33a}40%,100%{fill:#e8571c}}
@keyframes f-spark{0%,21.5%{opacity:0;transform:translate(0,0)}22%{opacity:1;transform:translate(0,0)}34%{opacity:0;transform:translate(var(--dx),var(--dy))}100%{opacity:0}}
@keyframes f-shake{0%,22%{transform:translate(0,0)}23%{transform:translate(0.6px,-1.4px)}24%{transform:translate(-0.4px,0.7px)}25.5%{transform:translate(0.2px,-0.4px)}27%,100%{transform:translate(0,0)}}
@keyframes f-tip{0%,22.5%{transform:rotate(0deg);animation-timing-function:ease-out}24%{transform:rotate(-4deg);animation-timing-function:ease-in-out}25.5%{transform:rotate(3deg);animation-timing-function:ease-in-out}27%{transform:rotate(-2deg);animation-timing-function:cubic-bezier(.55,0,1,.45)}35%{transform:rotate(90deg);animation-timing-function:ease-out}38%{transform:rotate(82deg);animation-timing-function:ease-in}41%{transform:rotate(90deg);animation-timing-function:ease-out}43%{transform:rotate(88deg);animation-timing-function:ease-in}45%,80%{transform:rotate(90deg);animation-timing-function:cubic-bezier(.4,0,.2,1)}90%,100%{transform:rotate(0deg)}}
@keyframes f-glow{0%,34.5%{fill:#16191d}35%{fill:#f2a33a}42%{fill:#f2a33a}52%,80%{fill:#e8571c}92%,100%{fill:#16191d}}
@keyframes f-land{0%,34.5%{opacity:0;transform:translate(0,0)}35%{opacity:1;transform:translate(0,0)}47%{opacity:0;transform:translate(var(--dx),var(--dy))}100%{opacity:0}}
@keyframes f-shadow{0%,34%{transform:scaleX(0)}35%,80%{transform:scaleX(1)}88%,100%{transform:scaleX(0)}}
@keyframes f-blink{0%,47%{opacity:0}48%{opacity:1}55%{opacity:0}62%{opacity:1}69%{opacity:0}76%{opacity:1}80%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.f-hammer,.f-hop,.f-face,.f-spark,.f-shake,.f-tip,.f-glow,.f-land,.f-shadow,.f-cursor{animation:none}}
